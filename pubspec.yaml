name: firstapp
description: Cross-platform dating application foundation built with Flutter, Supabase, and Firebase Cloud Messaging.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  firebase_core: ^5.2.0
  firebase_messaging: ^16.2.1
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  geolocator: ^14.0.2
  image_picker: ^1.2.4
  flutter_dotenv: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
